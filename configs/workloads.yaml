# Shared across all experiments — change here, not per experiment.
model: distilbert-base-uncased   # placeholder; pick one small pretrained Transformer and keep it fixed
precision: fp16
batch_sizes: [1, 4, 8, 16]
seq_lens: [128, 256, 512, 1024]  # drop shapes that exceed GPU memory
warmup_iters: 20
timed_iters: 100
# Torch-TensorRT settings swept in E1/E2
compiler_settings:
  min_block_size: [1, 3, 5, 10, 20]

# ---------------------------------------------------------------------------
# Sweep definition used by harness/sweep.py and E4 (added for the selector).
# ---------------------------------------------------------------------------
repeats: 5            # timing repeats per compiled module (the engine is built once)
settle_s: 2.0         # keep the GPU busy this long before timing (see harness/sweep.py: settle)

# Off-grid shapes used ONLY to test the E4 selector, never to fit it.
# Shapes longer than the model's position limit are dropped automatically.
heldout_workloads:    # [batch, seq_len]
  - [2, 192]
  - [2, 384]
  - [12, 192]
  - [12, 384]
  - [1, 384]
  - [8, 192]
  - [4, 320]
  - [16, 448]
  - [2, 768]
  - [12, 768]

# Named configurations. `scenario` groups configs that are fair to choose between:
#   natural          the model as Torch-TensorRT partitions it by itself
#   break_gelu       pretend GELU has no converter (forced fallback at every GELU)
#   break_layernorm  pretend LayerNorm has no converter (two forced fallbacks per layer)
#   control          not selectable; same settings as trt_default, built again, to measure
#                    how much latency moves between two builds of the same config
# `eager` belongs to every scenario. `default: true` marks the out-of-the-box config
# of each scenario.
#
# Partition check on the A100 (results/e4_workload_selector/partition_check.json), batch 4 x 128:
#   natural: 140 ops, all supported -> ONE TensorRT engine, no PyTorch blocks. min_block_size and
#     use_fast_partitioner therefore change nothing; only build effort and CUDA Graphs differ.
#   break_gelu: TensorRT blocks are 21-25 ops. min_block_size 1 -> 7 engines, 5..21 -> 6 engines,
#     22..25 -> 1 engine (rest in PyTorch).
#   The lowered graph calls LayerNorm aten.native_layer_norm.default (not aten.layer_norm.default).
configs:
  - {id: eager, backend: eager, scenario: all}

  - {id: trt_default, backend: trt, scenario: natural, default: true, settings: {min_block_size: 5}}
  - {id: trt_opt1, backend: trt, scenario: natural, settings: {min_block_size: 5, optimization_level: 1}}
  - {id: trt_opt5, backend: trt, scenario: natural, settings: {min_block_size: 5, optimization_level: 5}}
  - {id: trt_cudagraphs, backend: trt, scenario: natural, cudagraphs: true, settings: {min_block_size: 5}}
  - {id: trt_default_rebuild, backend: trt, scenario: control, settings: {min_block_size: 5}}

  - {id: gelu_mbs5, backend: trt, scenario: break_gelu, default: true, settings: {min_block_size: 5, torch_executed_ops: [torch.ops.aten.gelu.default]}}
  - {id: gelu_mbs1, backend: trt, scenario: break_gelu, settings: {min_block_size: 1, torch_executed_ops: [torch.ops.aten.gelu.default]}}
  - {id: gelu_mbs22, backend: trt, scenario: break_gelu, settings: {min_block_size: 22, torch_executed_ops: [torch.ops.aten.gelu.default]}}
  - {id: gelu_global, backend: trt, scenario: break_gelu, settings: {min_block_size: 5, use_fast_partitioner: false, torch_executed_ops: [torch.ops.aten.gelu.default]}}
  - {id: gelu_cudagraphs, backend: trt, scenario: break_gelu, cudagraphs: true, settings: {min_block_size: 5, torch_executed_ops: [torch.ops.aten.gelu.default]}}

  - {id: ln_mbs5, backend: trt, scenario: break_layernorm, default: true, settings: {min_block_size: 5, torch_executed_ops: [torch.ops.aten.native_layer_norm.default]}}
  - {id: ln_mbs1, backend: trt, scenario: break_layernorm, settings: {min_block_size: 1, torch_executed_ops: [torch.ops.aten.native_layer_norm.default]}}
  - {id: ln_mbs10, backend: trt, scenario: break_layernorm, settings: {min_block_size: 10, torch_executed_ops: [torch.ops.aten.native_layer_norm.default]}}
  - {id: ln_mbs20, backend: trt, scenario: break_layernorm, settings: {min_block_size: 20, torch_executed_ops: [torch.ops.aten.native_layer_norm.default]}}
  - {id: ln_global, backend: trt, scenario: break_layernorm, settings: {min_block_size: 5, use_fast_partitioner: false, torch_executed_ops: [torch.ops.aten.native_layer_norm.default]}}
  - {id: ln_cudagraphs, backend: trt, scenario: break_layernorm, cudagraphs: true, settings: {min_block_size: 5, torch_executed_ops: [torch.ops.aten.native_layer_norm.default]}}
